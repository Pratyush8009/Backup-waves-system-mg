<nz-layout class="app-layout">
    <nz-sider nzCollapsible nzWidth="256px" nzTheme="dark">
        <div class="sidebar-header">
            <button nz-button nzType="text" (click)="goBackToUnits()">
                <span nz-icon nzType="arrow-left"></span>
                <span>Model</span>
            </button>
        </div>

        <ul nz-menu nzMode="inline">
            <li nz-menu-item [routerLink]="['/units', unitId, 'systems', systemId, 'models', modelId]"
                routerLinkActive="ant-menu-item-selected" [routerLinkActiveOptions]="{ exact: true }"
                (click)="navigateToOverview()">
                <span nz-icon nzType="pie-chart"></span>
                <span>Overview</span>
            </li>

            <li nz-submenu nzTitle="Configuration" [(nzOpen)]="isConfigOpen">
                <ul>
                    <li nz-menu-item [routerLink]="['/units', unitId, 'systems', systemId, 'models', modelId, 'schema']"
                        routerLinkActive="ant-menu-item-selected" (click)="navigateToConfigSchema()">
                        <span nz-icon nzType="table"></span>
                        <span>Schema</span>
                    </li>
                    <li nz-menu-item
                        [routerLink]="['/units', unitId, 'systems', systemId, 'models', modelId, 'template']"
                        routerLinkActive="ant-menu-item-selected" (click)="navigateToConfigTemplate()">
                        <span nz-icon nzType="profile"></span>
                        <span>Template</span>
                    </li>
                    <li nz-menu-item
                        [routerLink]="['/units', unitId, 'systems', systemId, 'models', modelId, 'configuration']"
                        routerLinkActive="ant-menu-item-selected" (click)="navigateToConfigSettings()">
                        <span nz-icon nzType="setting"></span>
                        <span>Settings</span>
                    </li>
                </ul>
            </li>

            <li nz-menu-item [routerLink]="['/units', unitId, 'systems', systemId, 'models', modelId, 'testing']"
                routerLinkActive="ant-menu-item-selected" (click)="navigateToTesting()">
                <span nz-icon nzType="experiment"></span>
                <span>Testing</span>
            </li>

            <li nz-menu-item [routerLink]="['/units', unitId, 'systems', systemId, 'models', modelId, 'deploy']"
                routerLinkActive="ant-menu-item-selected" (click)="navigateToDeploy()">
                <span nz-icon nzType="rocket"></span>
                <span>Deployment</span>
            </li>
        </ul>
    </nz-sider>

    <nz-layout>
        <nz-header class="top-bar">
            <div class="header-title">
                <span>Model Workspace</span>
            </div>
        </nz-header>

        <nz-content>
            <div class="inner-content">
                <router-outlet></router-outlet>
            </div>
        </nz-content>
    </nz-layout>
</nz-layout>
