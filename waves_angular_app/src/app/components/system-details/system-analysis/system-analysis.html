<div class="container">
    <div class="header">
        <div class="header-left">
            <nz-input-group nzSearch>
                <input type="text" nz-input placeholder="Search analyses..." [(ngModel)]="searchText"
                    (ngModelChange)="onSearch()" />
            </nz-input-group>
        </div>
        <div class="header-right">
            <button nz-button nzType="default" (click)="loadAnalyses()" [nzLoading]="isLoading"
                style="margin-right: 8px;">
                <span nz-icon nzType="reload"></span> Refresh
            </button>
            <button nz-button nzType="primary" (click)="showModal()">
                <span nz-icon nzType="plus"></span> Create Analysis
            </button>
        </div>
    </div>

    <div class="loading-state" *ngIf="isLoading && analysesList.length === 0">
        <nz-spin nzSimple nzSize="large"></nz-spin>
        <p>Fetching data...</p>
    </div>

    <div *ngIf="!isLoading && filteredAnalyses.length === 0" class="empty-state">
        <nz-empty nzNotFoundImage="simple"></nz-empty>
        <h3>No Analysis Found</h3>
    </div>

    <div nz-row [nzGutter]="[24, 24]" *ngIf="!isLoading && filteredAnalyses.length > 0">
        <div nz-col nzXs="24" nzSm="12" nzMd="8" nzLg="6" *ngFor="let item of filteredAnalyses">
            <nz-card class="model-card" [nzHoverable]="true">

                <div class="card-header-tags">
                    <nz-tag [nzColor]="item.currentStatus === 'ACTIVE' ? 'success' : 'warning'">
                        {{ item.currentStatus }}
                    </nz-tag>
                    <nz-tag nzColor="blue" *ngIf="item.currentState">{{ item.currentState }}</nz-tag>

                    <div class="action-buttons">
                        <button nz-button nzType="text" nzDanger nz-popconfirm nzPopconfirmTitle="Delete Analysis?"
                            [nzLoading]="deleteLoading[item.analysisId]" (nzOnConfirm)="deleteAnalysis(item.analysisId)"
                            (click)="$event.stopPropagation()">
                            <span nz-icon nzType="delete"></span>
                        </button>
                    </div>
                </div>

                <div class="card-content">
                    <h3 class="model-title">{{ item.name }}</h3>
                    <p class="description">{{ item.description }}</p>

                    <div class="card-footer-metrics">
                        <div class="metric">
                            <span class="label">Versions:</span>
                            <span class="value">{{ item.versions?.length || 0 }}</span>
                        </div>
                        <div class="metric">
                            <span class="label">Success Rate:</span>
                            <span class="value">{{ item.stats?.successRate }}%</span>
                        </div>
                        <div class="metric">
                            <span class="label">Active:</span>
                            <span class="value">{{ item.currentVersion }}</span>
                        </div>
                    </div>
                </div>

                <div class="card-action">
                    <button nz-button nzType="primary" nzBlock (click)="viewAnalytics(item.analysisId)">
                        View System Analysis
                    </button>
                </div>
            </nz-card>
        </div>
    </div>

    <nz-modal [(nzVisible)]="isVisible" nzTitle="Create System Analysis" (nzOnCancel)="handleCancel()"
        (nzOnOk)="handleOk()" [nzOkLoading]="isCreating">
        <div *nzModalContent>
            <form nz-form [formGroup]="analysisForm" nzLayout="vertical">
                <nz-form-item>
                    <nz-form-label nzRequired>Analysis Name</nz-form-label>
                    <nz-form-control><input nz-input formControlName="name" /></nz-form-control>
                </nz-form-item>
                <nz-form-item>
                    <nz-form-label nzRequired>Description</nz-form-label>
                    <nz-form-control><textarea nz-input formControlName="description"
                            rows="3"></textarea></nz-form-control>
                </nz-form-item>
            </form>
        </div>
    </nz-modal>
</div>
