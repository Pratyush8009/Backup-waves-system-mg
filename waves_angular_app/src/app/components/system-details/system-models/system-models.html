<div class="container">
    <div class="header">
        <div class="header-left">
            <nz-input-group nzSearch>
                <input type="text" nz-input placeholder="Search models..." [(ngModel)]="searchText"
                    (ngModelChange)="onSearch()" />
            </nz-input-group>
        </div>
        <div class="header-right">
            <button nz-button nzType="default" (click)="loadModels()" [nzLoading]="isLoading"
                style="margin-right: 8px;">
                <span nz-icon nzType="reload"></span> Refresh
            </button>
            <button nz-button nzType="primary" (click)="showModal()">
                <span nz-icon nzType="plus"></span> Create Model
            </button>
        </div>
    </div>

    <div class="loading-state" *ngIf="isLoading && modelsList.length === 0">
        <nz-spin nzSimple nzSize="large"></nz-spin>
        <p>Fetching models...</p>
    </div>

    <div *ngIf="!isLoading && filteredModels.length === 0" class="empty-state">
        <nz-empty nzNotFoundImage="simple"></nz-empty>
        <h3>{{ searchText ? 'No Match Found' : 'No Models Found' }}</h3>
        <button *ngIf="searchText" nz-button (click)='clearSearch()'>Clear Search</button>
    </div>

    <div nz-row [nzGutter]="[24, 24]" *ngIf="!isLoading && filteredModels.length > 0">
        <div nz-col nzXs="24" nzSm="12" nzMd="8" nzLg="6" *ngFor="let model of filteredModels">
            <nz-card class="model-card" [class.selected]="selectedModelId === model.modelId" [nzHoverable]="true">

                <div class="card-header-tags">
                    <nz-tag [nzColor]="model.currentStatus === 'ACTIVE' ? 'success' : 'warning'">
                        {{ model.currentStatus }}
                    </nz-tag>
                    <nz-tag nzColor="blue" *ngIf="model.currentState">{{ model.currentState }}</nz-tag>

                    <div class="action-buttons">
                        <button nz-button nzType="text" nzDanger nz-popconfirm nzPopconfirmTitle="Delete model?"
                            [nzLoading]="deleteLoading[model.modelId]" (nzOnConfirm)="deleteModel(model.modelId)"
                            (click)="$event.stopPropagation()">
                            <span nz-icon nzType="delete"></span>
                        </button>
                    </div>
                </div>

                <div class="card-content">
                    <h3 class="model-title">{{ model.name }}</h3>
                    <p class="description">{{ model.description }}</p>

                    <div class="card-footer-metrics">
                        <div class="metric">
                            <span class="label">Versions:</span>
                            <span class="value">{{ model.versions?.length || 0 }}</span>
                        </div>
                        <div class="metric">
                            <span class="label">Active:</span>
                            <span class="value">{{ model.currentVersion }}</span>
                        </div>
                    </div>
                </div>

                <div class="card-action">
                    <button nz-button nzType="primary" nzBlock
                        (click)="viewModelDetails(model.modelId); $event.stopPropagation()">
                        View Model Analytics
                    </button>
                </div>
            </nz-card>
        </div>
    </div>

    <nz-modal [(nzVisible)]="isVisible" nzTitle="Create New System Model" (nzOnCancel)="handleCancel()"
        (nzOnOk)="handleOk()" [nzOkLoading]="isCreating">
        <div *nzModalContent>
            <form nz-form [formGroup]="modelForm" nzLayout="vertical">
                <nz-form-item>
                    <nz-form-label nzRequired>Model Name</nz-form-label>
                    <nz-form-control nzErrorTip="Name is required">
                        <input nz-input formControlName="name" placeholder="E.g. Production Line 1 Model" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                    <nz-form-label nzRequired>Description</nz-form-label>
                    <nz-form-control nzErrorTip="Description is required">
                        <textarea nz-input formControlName="description" rows="3"
                            placeholder="Describe the model purpose"></textarea>
                    </nz-form-control>
                </nz-form-item>

                <div nz-row [nzGutter]="16">
                    <div nz-col nzSpan="12">
                        <nz-form-item>
                            <nz-form-label nzRequired>Type</nz-form-label>
                            <nz-form-control>
                                <nz-select formControlName="type">
                                    <nz-option nzValue="PREDICTION" nzLabel="Prediction"></nz-option>
                                    <nz-option nzValue="CLASSIFICATION" nzLabel="Classification"></nz-option>
                                    <nz-option nzValue="ANOMALY" nzLabel="Anomaly Detection"></nz-option>
                                </nz-select>
                            </nz-form-control>
                        </nz-form-item>
                    </div>
                    <div nz-col nzSpan="12">
                        <nz-form-item>
                            <nz-form-label nzRequired>Category</nz-form-label>
                            <nz-form-control>
                                <nz-select formControlName="category">
                                    <nz-option nzValue="PerformanceMonitoring"
                                        nzLabel="Performance Monitoring"></nz-option>
                                    <nz-option nzValue="QualityControl" nzLabel="Quality Control"></nz-option>
                                    <nz-option nzValue="Maintenance" nzLabel="Maintenance"></nz-option>
                                </nz-select>
                            </nz-form-control>
                        </nz-form-item>
                    </div>
                </div>
            </form>
        </div>
    </nz-modal>
</div>
