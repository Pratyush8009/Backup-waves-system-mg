<div class="page-root">
  <div class="page-toolbar">
    <a routerLink="/template-landing-dashboard" class="page-back">&larr; All templates</a>
    <h1 class="page-title">Template With Plots Configuration &amp; Feed Data</h1>
    <p class="page-subtitle">Full template &mdash; sections, plot configuration and live feed data hydrated in.</p>
  </div>

  @if (entityId$ | async; as entityId) {
  <app-template-renderer [entityId]="entityId" [templateId]="templateId$ | async"
    [mode]="'feed'"></app-template-renderer>
  }
</div>
