<div class="switching-section">
    <div class="mode-toggle">
        <div class="toggle-option" [class.active]="!isFlowMode" (click)="toggleEditor()">
            Block Editor
        </div>

        <div class="toggle-option" [class.active]="isFlowMode" (click)="toggleEditor()">
            Flow Editor
        </div>
    </div>

</div>
<div class="tab-content" [class.fullscreen]="isFullScreen">
    <div class="config-wrapper" [class.fullscreen]="isFullScreen">
        <app-configure-page *ngIf="!isFlowMode" (fullscreenChange)="onFullscreenChange($event)"></app-configure-page>
        <app-flow-editor (fullscreenChange)="onFullscreenChange($event)" *ngIf="isFlowMode"></app-flow-editor>
    </div>

</div>
